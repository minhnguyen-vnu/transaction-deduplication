# =========================================
# App / Server
# =========================================
spring.application.name=routingservice
server.port=8091

# =========================================
# Kafka (cp-kafka KRaft exposed on localhost:9094)
# =========================================
spring.kafka.bootstrap-servers=localhost:9094

# ----- Listener container (so you don't need a custom factory bean)
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

# ----- CONSUMER: TransactionStatusCommand -----
spring.kafka.consumer.group-id=status-tracking-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# JsonDeserializer config (properties style; do NOT also set via setters in code)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.trackingservice.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.trackingservice.core.domain.dto.TransactionStatusCommand
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# ----- PRODUCER: KeyCleanupRequested -----
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.retry.backoff.ms=100
spring.kafka.producer.properties.request.timeout.ms=30000

# =========================================
# MongoDB
# =========================================
spring.data.mongodb.uri=mongodb://localhost:27017/tracking_service

# =========================================
# Service-specific topics
# =========================================
tracking.topics.inbound=txn.status.in
tracking.topics.cleanup=dedup.cleanup.request
tracking.cleanup.send-timeout-ms=30000

